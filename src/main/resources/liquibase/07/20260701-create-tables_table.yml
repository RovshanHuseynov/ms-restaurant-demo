databaseChangeLog:
  - changeSet:
      id: create-restaurant_tables-table
      author: Rovshan Huseynov
      changes:
        - createTable:
            tableName: restaurant_tables
            remarks: Table to store information about restaurant_tables
            columns:
              - column:
                  name: id
                  type: varchar(16)
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_restaurant_tables
                    nullable: false
              - column:
                  name: restaurant_id
                  type: varchar(16)
                  constraints:
                    nullable: false
                    foreignKeyName: fk_restaurant_tables_restaurant
                    referencedTableName: restaurants
                    referencedColumnNames: id
              - column:
                  name: name
                  type: varchar(64)
                  constraints:
                    nullable: false
              - column:
                  name: number
                  type: varchar(8)
                  remarks: "Table number designation (e.g., '5', '12A')"
              - column:
                  name: capacity
                  type: smallint
                  constraints:
                    nullable: false
              - column:
                  name: state
                  type: varchar(16)
                  constraints:
                    nullable: false
                  defaultValue: "ACTIVE"
                  remarks: enum with values ACTIVE, PAUSED, ARCHIVED, BLOCKED
              - column:
                  name: state_reason
                  type: text
                  constraints:
                    nullable: true
              - column:
                  name: created_at
                  type: timestamp
                  defaultValueComputed: "CURRENT_TIMESTAMP"
                  remarks: insert_datetime of the row
              - column:
                  name: updated_at
                  type: timestamp
                  remarks: last_update_datetime of the row
